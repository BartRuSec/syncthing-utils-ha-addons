name: Update Syncthing
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report versions, do not bump, tag or release
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Current version (published image)
        id: current
        run: |
          addon_version=$(sed -n 's/^version: *//p' syncthing-relay/config.yaml)
          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/syncthing-utils-ha-addons-syncthing-relay-amd64:${addon_version}"
          current=unknown
          if docker pull "$image"; then
            current=$(docker run --rm --entrypoint sh "$image" -c 'apk list -I syncthing-utils 2>/dev/null | head -n 1 | cut -d" " -f1')
          fi
          echo "version=${current}" >> "$GITHUB_OUTPUT"

      - name: Newest version (what a rebuild would install)
        id: newest
        run: |
          base_image=$(sed -n 's/^FROM //p' syncthing-relay/Dockerfile | head -n 1)
          newest=$(docker run --rm --entrypoint sh "$base_image" -c 'apk update >/dev/null 2>&1 && apk search -e -v syncthing-utils 2>/dev/null | head -n 1 | cut -d" " -f1')
          echo "version=${newest}" >> "$GITHUB_OUTPUT"

      - name: Compare
        id: compare
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          NEWEST: ${{ steps.newest.outputs.version }}
        run: |
          current="${CURRENT#syncthing-utils-}"
          newest="${NEWEST#syncthing-utils-}"
          newer=false
          if [ "$CURRENT" = "unknown" ]; then
            note="No published image found for the current add-on version; do the first release manually."
          elif [ -z "$NEWEST" ]; then
            note="Could not determine the newest version from the base image."
          elif [ "$current" = "$newest" ]; then
            note="Up to date."
          elif [ "${current%%.*}" != "${newest%%.*}" ]; then
            note="Major version change (${current} -> ${newest}); release it manually."
          else
            newer=true
            note="Newer version available."
          fi
          {
            echo "newer=${newer}"
            echo "current=${current}"
            echo "newest=${newest}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "| | syncthing-utils |"
            echo "|---|---|"
            echo "| Current build | ${current} |"
            echo "| Newest in base image | ${newest} |"
            echo
            echo "${note}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upstream and Alpine info
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream=$(gh api repos/syncthing/syncthing/releases/latest --jq .tag_name || echo unknown)
          base_tag=$(sed -n 's#^FROM ghcr.io/home-assistant/base:##p' syncthing-relay/Dockerfile | head -n 1)
          next_tag="${base_tag%%.*}.$(( ${base_tag#*.} + 1 ))"
          token=$(curl -s "https://ghcr.io/token?scope=repository:home-assistant/base:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/home-assistant/base/manifests/${next_tag}")
          [ "$code" = "200" ] && next_state="available" || next_state="not published yet"
          {
            echo
            echo "| Info | |"
            echo "|---|---|"
            echo "| Upstream Syncthing release | ${upstream} |"
            echo "| Alpine base in Dockerfile | ${base_tag} |"
            echo "| Next Alpine base (${next_tag}) | ${next_state} |"
            echo
            echo "Changing the Alpine base (and so possibly the Syncthing major/minor) is a manual release: edit the \`FROM\` line of both Dockerfiles and bump \`version:\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bump add-on version and tag
        id: bump
        if: steps.compare.outputs.newer == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          current=$(sed -n 's/^version: *//p' syncthing-relay/config.yaml)
          new="${current%.*}.$(( ${current##*.} + 1 ))"
          sed -i "s/^version: .*/version: ${new}/" syncthing-discovery/config.yaml syncthing-relay/config.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for changelog in syncthing-discovery/CHANGELOG.md syncthing-relay/CHANGELOG.md; do
            { head -n 1 "$changelog"; printf '\n## %s\n\n- Updated syncthing-utils from %s to %s\n' "$new" "${{ steps.compare.outputs.current }}" "${{ steps.compare.outputs.newest }}"; tail -n +2 "$changelog"; } > "$changelog.tmp"
            mv "$changelog.tmp" "$changelog"
          done
          git add syncthing-discovery/config.yaml syncthing-relay/config.yaml syncthing-discovery/CHANGELOG.md syncthing-relay/CHANGELOG.md
          git commit -m "Bump add-ons to ${new} (syncthing-utils ${{ steps.compare.outputs.newest }})"
          git tag "v${new}"
          git push origin HEAD "v${new}"
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "version=${new}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${new} and tagged v${new}" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: check
    if: needs.check.outputs.bumped == 'true'
    # Tags pushed with GITHUB_TOKEN don't trigger release.yml, so call it directly
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      publish: true
      ref: v${{ needs.check.outputs.version }}

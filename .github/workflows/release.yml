name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: Build and push images (otherwise test build only)
        type: boolean
        default: false
      ref:
        description: Git ref to build (defaults to the caller's ref)
        type: string
        default: ""

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build ${{ matrix.addon }} ${{ matrix.arch }} image
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # To check out the code
      id-token: write # Needed for Cosign signing
      packages: write # To push images to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix:
        addon: [syncthing-discovery, syncthing-relay]
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Read add-on manifest
        id: manifest
        run: |
          {
            echo "version=$(sed -n 's/^version: *//p' ${{ matrix.addon }}/config.yaml)"
            echo "name=$(sed -n 's/^name: *//p' ${{ matrix.addon }}/config.yaml)"
            echo "description=$(sed -n 's/^description: *//p' ${{ matrix.addon }}/config.yaml)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.addon }}-${{ matrix.arch }}"
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.addon }} ${{ matrix.arch }} image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ${{ matrix.addon }}
          image: ${{ steps.manifest.outputs.image }}
          image-tags: ${{ steps.manifest.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ steps.manifest.outputs.name }}
            io.hass.description=${{ steps.manifest.outputs.description }}
            io.hass.url=https://github.com/${{ github.repository }}/tree/main/${{ matrix.addon }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.manifest.outputs.version }}
          push: ${{ github.event_name == 'push' || inputs.publish }}
          skip-existing: ${{ steps.manifest.outputs.version }}
          version: ${{ steps.manifest.outputs.version }}
